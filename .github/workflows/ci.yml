# .github/workflows/ci.yml
#
# Staged pipeline: lint runs first (cheap gate, fails fast); once it is green
# the spec-gate, the RSpec suite and the driver contract run. Arrows are
# `needs:` edges:
#
#   lint ──┬── spec-gate
#          ├── rspec ──────┐
#          ├── drivers ────┼── trace ── notify-docs
#          └── pact ───────┘
#                └── pact-publish
#
#   lint         – RuboCop. Runs first; nothing else starts until it is green.
#   spec-gate    – openspec validate.                         needs: lint
#   rspec        – the RSpec suite without the driver specs,  needs: lint
#                  writing a partial repo trace.
#   drivers      – the driver contract against real channels, needs: lint
#                  one leg per channel (cli: the latest greeter-cli release;
#                  http: the stage target from config/environments.yml), each
#                  writing a partial repo trace.
#   pact         – the Pact consumer specs on every trigger,  needs: lint
#                  pull requests too, with no secrets. Writes a partial repo
#                  trace and uploads the pact files.
#   trace        – merges the partial traces. On main and the weekly schedule,
#                  when every input job succeeded, uploads `repo-trace`.
#   notify-docs  – on main and the weekly schedule, asks greeter-docs to
#                  refresh (repository_dispatch docs-refresh).
#   pact-publish – push to main or of a v* tag only:          needs: pact
#                  publishes this run's pact to the Pact Broker; on a tag
#                  also records the suite as deployed to stage and prod. The
#                  only job with the broker token (pact-broker environment).
#
# Ruby: CI tracks the latest 3.3.x patch (RUBY_VERSION below). Newer runner
# images only build the latest patch of each series, so an exact patch pin would
# break whenever a new patch ships. The repo's .ruby-version (3.3.13) remains
# the local development pin.

name: CI

"on":
  push:
    # The ledger branches hold generated data only, not code to lint or validate.
    branches-ignore: [ledger-prod, ledger-stage]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  # Weekly, so greeter-docs sees current results even when nothing is pushed.
  # This also calls the stage http target; that is accepted.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Pull-request runs for the same ref cancel each other, so a fast-follow push
# doesn't queue. Runs on main and weekly runs are in separate groups (the event
# name is part of the group) and are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUNDLE_JOBS: 4
  BUNDLE_RETRY: 3
  # Bundler must match `BUNDLED WITH` in Gemfile.lock.
  BUNDLER_VERSION: "4.0.22"
  # Latest patch of the 3.3 series; keep the minor in step with .ruby-version.
  RUBY_VERSION: "3.3"
  # Pin the OpenSpec CLI so the spec-gate is reproducible (a floating @latest
  # can add rules that fail the gate with no change to the repo). Keep in sync
  # with the locally installed version; bump deliberately.
  OPENSPEC_VERSION: "1.14.1"
  # The Pact CLI image that sees the broker token, pinned by tag and image-index
  # digest so a moved tag cannot change the code (add-pact-consumer design.md,
  # "Pinned pact-cli image"). Bump deliberately: re-read the digest with
  # `docker buildx imagetools inspect pactfoundation/pact-cli:<tag>`.
  PACT_CLI_IMAGE: "pactfoundation/pact-cli:1.5.0.5@sha256:77b98079e5be279353f61e116a0b9b3af19e55b215532b30d430ff5df66e5ac9"

jobs:
# ═════════════════════════════════════════════════════════════════════════════
# LINTING
# ═════════════════════════════════════════════════════════════════════════════
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Run RuboCop
        run: |
          bundle check
          bundle exec rubocop \
            --config .rubocop.yml \
            --format github \
            --debug

# ═════════════════════════════════════════════════════════════════════════════
# spec-gate  (OpenSpec structural validation — blocks merge if malformed)
# ═════════════════════════════════════════════════════════════════════════════
  spec-gate:
    name: OpenSpec
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install OpenSpec CLI (pinned)
        run: npm install --global "@fission-ai/openspec@${{ env.OPENSPEC_VERSION }}"

      - name: Validate all OpenSpec changes
        run: openspec validate --all --strict --json --no-interactive

# ═════════════════════════════════════════════════════════════════════════════
# rspec  (everything except the driver contract, which needs real channels)
# ═════════════════════════════════════════════════════════════════════════════
  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Run the suite without the driver specs
        env:
          REPO_TRACE_PATH: tmp/repo-trace-spec.json
        run: >-
          bundle exec rspec
          --exclude-pattern 'spec/drivers/**/*_spec.rb'
          --format progress --format RepoTraceFormatter

      - name: Keep the partial trace
        uses: actions/upload-artifact@v7
        with:
          name: repo-trace-spec
          path: tmp/repo-trace-spec.json
          retention-days: 1
          if-no-files-found: error

# ═════════════════════════════════════════════════════════════════════════════
# drivers  (the driver contract against each real channel)
# ═════════════════════════════════════════════════════════════════════════════
  drivers:
    name: Driver contract (${{ matrix.channel }})
    # The artifact channel's Gemfile may declare a Ruby that newer runner images
    # cannot install, so the job uses the same image as record mode.
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: [cli, http]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up the suite's Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      # ── artifact channel ────────────────────────────────────────────────────
      # The steps below follow record.yml's run job.
      #
      # The only step that sees a token. It reads the latest release and the
      # commit its tag points at, and runs no downloaded code. It runs before the
      # fetch, so no release code can have touched PATH or the runner's file
      # commands by the time the token is used.
      - name: Look up the latest greeter-cli release
        if: matrix.channel == 'cli'
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo greeterhq/greeter-cli --json tagName --jq .tagName)"
          sha="$(gh api "repos/greeterhq/greeter-cli/commits/${tag}" --jq .sha)"
          { echo "version=${tag}"; echo "sha=${sha}"; } >> "$GITHUB_OUTPUT"

      - name: Fetch the release (checksum and tag checked)
        if: matrix.channel == 'cli'
        id: fetch
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          SHA: ${{ steps.latest.outputs.sha }}
        run: >-
          echo "dir=$(ruby bin/cli-release fetch --repo greeterhq/greeter-cli
          --version "$VERSION" --sha "$SHA" --out tmp/cli)" >> "$GITHUB_OUTPUT"

      - name: Read the Ruby the release declares
        if: matrix.channel == 'cli'
        id: declared
        env:
          CLI_DIR: ${{ steps.fetch.outputs.dir }}
        run: |
          declared="$(ruby bin/cli-release ruby-version "$CLI_DIR")"
          echo "ruby=${declared:-3.3}" >> "$GITHUB_OUTPUT"

      - name: Set up the Ruby the release declares
        if: matrix.channel == 'cli'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.declared.outputs.ruby }}

      - name: Install the release and write its launcher
        if: matrix.channel == 'cli'
        id: launcher
        env:
          CLI_DIR: ${{ steps.fetch.outputs.dir }}
        run: echo "path=$(ruby bin/cli-release install "$CLI_DIR" --launcher "$RUNNER_TEMP/greeter-launch")" >> "$GITHUB_OUTPUT"

      - name: Go back to the suite's Ruby
        if: matrix.channel == 'cli'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      # ── service channel ─────────────────────────────────────────────────────
      # The stage target from the committed configuration, never from an input.
      # Environments#resolve checks the host against its allowed pattern.
      - name: Resolve the stage http target
        if: matrix.channel == 'http'
        run: |
          base_url="$(ruby -Ilib -rgreeter_acceptance/environments -e '
            puts GreeterAcceptance::Environments.load("config/environments.yml")
                   .resolve(environment: "stage", channel: "http").base_url')"
          echo "GREETER_BASE_URL=${base_url}" >> "$GITHUB_ENV"

      # ── run ─────────────────────────────────────────────────────────────────
      # The http driver's synthetic header stays on (its default).
      - name: Run the driver contract
        env:
          CHANNEL: ${{ matrix.channel }}
          GREETER_CHANNEL: ${{ matrix.channel }}
          GREETER_CLI_CMD: ${{ steps.launcher.outputs.path }}
        run: >-
          REPO_TRACE_PATH="tmp/repo-trace-drivers-${CHANNEL}.json"
          bundle exec rspec "spec/drivers/${CHANNEL}_driver_spec.rb"
          --format progress --format RepoTraceFormatter

      - name: Keep the partial trace
        uses: actions/upload-artifact@v7
        with:
          name: repo-trace-drivers-${{ matrix.channel }}
          path: tmp/repo-trace-drivers-${{ matrix.channel }}.json
          retention-days: 1
          if-no-files-found: error

# ═════════════════════════════════════════════════════════════════════════════
# pact  (the Pact consumer specs; every trigger, no secrets)
# ═════════════════════════════════════════════════════════════════════════════
  pact:
    name: Pact consumer
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      # The spec deletes any earlier pact file first, so pacts/ holds only this
      # run's interactions.
      - name: Run the pact specs
        env:
          REPO_TRACE_PATH: tmp/repo-trace-pact.json
        run: >-
          bundle exec rspec -t pact spec/pact/providers
          --format progress --format RepoTraceFormatter

      - name: Keep the partial trace
        uses: actions/upload-artifact@v7
        with:
          name: repo-trace-pact
          path: tmp/repo-trace-pact.json
          retention-days: 1
          if-no-files-found: error

      # Data only: pact-publish checks it before any step with the token.
      - name: Keep the pact files
        uses: actions/upload-artifact@v7
        with:
          name: pacts
          path: pacts/
          retention-days: 1
          if-no-files-found: error

# ═════════════════════════════════════════════════════════════════════════════
# trace  (merge the partial traces; publish on main and weekly)
# ═════════════════════════════════════════════════════════════════════════════
  trace:
    name: Repo trace
    runs-on: ubuntu-latest
    needs: [rspec, drivers, pact]
    # Runs after a failed input job too, so that the failure is reported here
    # (the last step) rather than the job being skipped silently.
    if: ${{ !cancelled() }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Standard-library Ruby only: no bundler, no gems.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      # Artifacts from this run only, by name, each in its own directory.
      - name: Download the RSpec trace
        if: needs.rspec.result == 'success' && needs.drivers.result == 'success' && needs.pact.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: repo-trace-spec
          path: tmp/traces/spec

      - name: Download the cli driver trace
        if: needs.rspec.result == 'success' && needs.drivers.result == 'success' && needs.pact.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: repo-trace-drivers-cli
          path: tmp/traces/cli

      - name: Download the http driver trace
        if: needs.rspec.result == 'success' && needs.drivers.result == 'success' && needs.pact.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: repo-trace-drivers-http
          path: tmp/traces/http

      - name: Download the pact trace
        if: needs.rspec.result == 'success' && needs.drivers.result == 'success' && needs.pact.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: repo-trace-pact
          path: tmp/traces/pact

      - name: Merge the traces
        if: needs.rspec.result == 'success' && needs.drivers.result == 'success' && needs.pact.result == 'success'
        run: >-
          ruby bin/merge-repo-trace tmp/repo-trace.json
          tmp/traces/spec/repo-trace-spec.json
          tmp/traces/cli/repo-trace-drivers-cli.json
          tmp/traces/http/repo-trace-drivers-http.json
          tmp/traces/pact/repo-trace-pact.json

      - name: Publish the merged trace
        if: >-
          needs.rspec.result == 'success' && needs.drivers.result == 'success' && needs.pact.result == 'success' &&
          (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@v7
        with:
          name: repo-trace
          path: tmp/repo-trace.json
          retention-days: 90
          if-no-files-found: error

      # A red input job makes this job red too, so notify-docs does not run.
      - name: Fail when an input job did not succeed
        if: needs.rspec.result != 'success' || needs.drivers.result != 'success' || needs.pact.result != 'success'
        run: exit 1

# ═════════════════════════════════════════════════════════════════════════════
# notify-docs  (ask greeter-docs to refresh; main and weekly only)
# ═════════════════════════════════════════════════════════════════════════════
  notify-docs:
    name: Notify greeter-docs
    runs-on: ubuntu-latest
    needs: trace
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions: {}

    steps:
      - name: Mint the greeterhq-dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: greeterhq
          repositories: greeter-docs
          permission-contents: write

      - name: Send docs-refresh
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: >-
          gh api repos/greeterhq/greeter-docs/dispatches
          -f event_type=docs-refresh
          -f 'client_payload[repo]=greeter-acceptance'

# ═════════════════════════════════════════════════════════════════════════════
# pact-publish  (publish the pact; on a suite tag, record stage and prod)
# ═════════════════════════════════════════════════════════════════════════════
# The only job that sees PACT_BROKER_TOKEN. The token is a secret of the
# pact-broker environment, which only main and v* tags may use, so a job on any
# other ref cannot read it even with a changed workflow. Each pact-broker step
# gets the token in its own env and passes it to pact-cli by name. This job runs
# no repository code and installs no gems: every check before the token is
# standard-library Ruby or git, and the pact files are treated as data.
  pact-publish:
    name: Publish the pact
    runs-on: ubuntu-latest
    needs: pact
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: pact-broker
    permissions:
      contents: read

    steps:
      # Full history, so origin/main is present for the tag ancestry check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Standard-library Ruby only: no bundler, no gems.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      # This run's pacts only, by name, into their own directory.
      - name: Download the pact files
        uses: actions/download-artifact@v8
        with:
          name: pacts
          path: pacts

      - name: Check the pact files and the broker URL
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
        run: |
          ruby - <<'RUBY'
          require "json"
          url = ENV.fetch("PACT_BROKER_BASE_URL", "")
          abort "::error::PACT_BROKER_BASE_URL must start with https://, got #{url.inspect}" unless url.start_with?("https://")
          expected = "greeter-acceptance-greeter-http.json"
          files = Dir.children("pacts").sort
          abort "::error::pacts/ must hold only #{expected}, found: #{files.join(", ")}" unless files == [expected]
          pact = JSON.parse(File.read(File.join("pacts", expected)))
          consumer = pact.dig("consumer", "name")
          provider = pact.dig("provider", "name")
          abort "::error::pact consumer is #{consumer.inspect}, expected greeter-acceptance" unless consumer == "greeter-acceptance"
          abort "::error::pact provider is #{provider.inspect}, expected greeter-http" unless provider == "greeter-http"
          RUBY

      - name: Check the tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          || { echo "::error::$GITHUB_SHA is not on origin/main; a suite tag must be cut from main"; exit 1; }

      # The same check record.yml makes before it runs anything.
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(ruby -Ilib -rgreeter_acceptance/version -e 'print GreeterAcceptance::VERSION')"
          [ "v${version}" = "$GITHUB_REF_NAME" ] || { echo "::error::GreeterAcceptance::VERSION (${version}) does not match the tag $GITHUB_REF_NAME"; exit 1; }

      - name: Publish the pact from main
        if: github.ref == 'refs/heads/main'
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: >-
          docker run --rm -e PACT_BROKER_BASE_URL -e PACT_BROKER_TOKEN -v "$PWD/pacts:/pacts:ro" "$PACT_CLI_IMAGE"
          pact-broker publish /pacts --consumer-app-version "$GITHUB_SHA" --branch main

      # A tag has no branch. Publishing the same sha and content again is a
      # no-op when main already published it.
      - name: Publish the pact for the suite tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: >-
          docker run --rm -e PACT_BROKER_BASE_URL -e PACT_BROKER_TOKEN -v "$PWD/pacts:/pacts:ro" "$PACT_CLI_IMAGE"
          pact-broker publish /pacts --consumer-app-version "$GITHUB_SHA"

      # A suite tag is what the channel gates run (ACCEPTANCE_REF), so the
      # tagged version is what stage and prod are tested against.
      - name: Record the stage deployment
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: >-
          docker run --rm -e PACT_BROKER_BASE_URL -e PACT_BROKER_TOKEN -v "$PWD/pacts:/pacts:ro" "$PACT_CLI_IMAGE"
          pact-broker record-deployment --pacticipant greeter-acceptance --version "$GITHUB_SHA" --environment stage

      - name: Record the prod deployment
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: >-
          docker run --rm -e PACT_BROKER_BASE_URL -e PACT_BROKER_TOKEN -v "$PWD/pacts:/pacts:ro" "$PACT_CLI_IMAGE"
          pact-broker record-deployment --pacticipant greeter-acceptance --version "$GITHUB_SHA" --environment prod
